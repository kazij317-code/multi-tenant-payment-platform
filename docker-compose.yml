version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Nabhan123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payment_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: payment_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: .
    container_name: payment_api
    ports:
      - "3000:3000"
    # DATABASE_URL=postgresql://postgres:Nabhan123@localhost:5432/payment_platform?schema=public
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Nabhan123}@db:5432/${POSTGRES_DB:-payment_platform}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_payment_platform_2026_secure}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: