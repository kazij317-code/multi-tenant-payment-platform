apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "payment-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-api-secret
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:SecurePassword123@payment-postgres:5432/payment_platform?schema=public"
  JWT_SECRET: "k8s_super_secret_jwt_key_2026_production_env"
