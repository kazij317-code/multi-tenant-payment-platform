name: Multi-Tenant Payment Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Build, Lint & Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payment_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install API Dependencies
        run: |
          cd apps/api
          npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Run Backend Unit & Controller Tests
        run: |
          cd apps/api
          npm run test -- --passWithNoTests

      - name: Run Backend Integration / E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/payment_platform_test?schema=public
          JWT_SECRET: test_jwt_secret_key_12345
        run: |
          cd apps/api
          npx prisma db push --accept-data-loss
          npm run test:e2e -- --passWithNoTests

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  docker-build:
    name: Build Docker Container
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: payment-platform-api:latest
